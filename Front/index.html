<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>Login page</title>
    <link rel="stylesheet" href="/css/mainlog.css" >
    <link rel="preconnect" href="https://fonts.googleapis.com" >
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin >
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap"
      rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
      <link rel="stylesheet" href="/fonts/remixicon.css">
  </head>
  <body>
    <div class="container">

      <img src="image/blob.svg" class="blob" />
      <div class="orbit"></div>

      <div class="log--page sign-in-div">
        <div class="image-login-top">
          <img src="/image/rivas2.png" />
        </div>
        <div class="h-tag-top">
          <h2>به ریواس خوش اومدی!</h2>
          <h3 id="sign-in-error">Keep your data safe!</h3>
        </div>
        <form class="form">
          <div class="textbox">
            <input required type="text" id="sign-in-email">
            <label>ایمیل</label>
          </div>
          <div class="textbox">
            <input required  type="text" id="sign-in-password" >
             <div class="eye-icon" >
               <i class="ri-eye-fill" id="eye-icon-sign-in"></i>
             </div>
            <label>رمز عبور</label>
          </div>
          <button type="submit" id="subbtn-login">ورود</button>
        </form>
        <p class="footer">حسابی نداری؟ <a href="/upload.html">ثبت نام!</a></p>
      </div>
    </div>
    <script src="./js/jQuery.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="/js/log.js"></script>
  </body>
</html>
