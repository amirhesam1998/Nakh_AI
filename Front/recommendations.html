<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پیشنهادات</title>
    <link rel="stylesheet" href="css/mainlog.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="fonts/remixicon.css" />
    <style>
      .rec-container {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px;
      }
      .rec-loading {
        text-align: center;
        padding: 60px 20px;
      }
      .rec-loading .loader {
        display: inline-block;
        width: 48px;
        height: 48px;
        border: 4px solid rgba(0,0,0,0.1);
        border-top-color: #6c5ce7;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .rec-loading p {
        margin-top: 16px;
        color: #666;
        font-size: 14px;
      }
      .rec-text {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 24px;
        line-height: 1.8;
        white-space: pre-wrap;
        font-size: 15px;
      }
      .rec-products {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
      }
      .product-card {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        padding: 16px;
        text-align: center;
      }
      .product-card h4 { margin: 0 0 8px; font-size: 15px; }
      .product-card .price { color: #6c5ce7; font-weight: 600; }
      .product-card .category { font-size: 12px; color: #888; margin-top: 4px; }
      .rec-error {
        text-align: center;
        color: #e74c3c;
        padding: 40px 20px;
      }
      .rec-error button {
        margin-top: 16px;
        padding: 8px 24px;
        border: none;
        border-radius: 8px;
        background: #6c5ce7;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="image/blob.svg" class="blob" alt="background" />
      <div class="orbit"></div>

      <div class="rec-container">
        <h2 style="text-align:center;margin-bottom:24px;">پیشنهادات محصول</h2>

        <!-- Loading -->
        <div id="recLoading" class="rec-loading">
          <span class="loader"></span>
          <p>در حال دریافت پیشنهادات از هوش مصنوعی...</p>
          <p style="font-size:12px;color:#999;">این فرایند ممکن است تا ۳ دقیقه طول بکشد.</p>
        </div>

        <!-- Results (hidden initially) -->
        <div id="recResults" style="display:none;">
          <div id="recText" class="rec-text"></div>
          <h3 style="margin-bottom:12px;">محصولات پیشنهادی</h3>
          <div id="recProducts" class="rec-products"></div>
        </div>

        <!-- Error (hidden initially) -->
        <div id="recError" class="rec-error" style="display:none;">
          <p id="recErrorMsg">خطا در دریافت پیشنهادات</p>
          <button onclick="location.reload()">تلاش دوباره</button>
        </div>
      </div>
    </div>

    <script src="./js/jQuery.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="./js/recommendations.js"></script>
  </body>
</html>
