<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پیشنهادات</title>
    <link rel="stylesheet" href="css/mainlog.css" />

    <link rel="stylesheet" href="fonts/remixicon.css" />
    <style>
      .rec-container {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px;
      }
      .rec-loading {
        text-align: center;
        padding: 60px 20px;
      }
      .rec-loading .loader {
        display: inline-block;
        width: 48px;
        height: 48px;
        border: 4px solid rgba(0,0,0,0.1);
        border-top-color: #6c5ce7;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .rec-loading p {
        margin-top: 16px;
        color: #666;
        font-size: 14px;
      }
      .rec-text {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 24px;
        line-height: 1.8;
        white-space: pre-wrap;
        font-size: 15px;
      }
      .rec-products {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
      }
      /* Card link wrapper — no underline, block-level */
      .product-card-link {
        text-decoration: none;
        color: inherit;
        display: block;
      }
      .product-card {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        padding: 16px;
        text-align: center;
        transition: box-shadow 0.2s, transform 0.2s;
        cursor: pointer;
        position: relative;
      }
      .product-card:hover {
        box-shadow: 0 4px 16px rgba(108, 92, 231, 0.15);
        transform: translateY(-2px);
      }
      .product-card.out-of-stock { opacity: 0.7; }
      .product-card .product-name { margin: 0 0 6px; font-size: 15px; color: #2d3436; }
      .product-card .brand { font-size: 12px; color: #999; margin-bottom: 6px; }
      .product-card .category { font-size: 12px; color: #888; margin-top: 6px; }

      /* Image wrapper + out-of-stock overlay */
      .product-card .product-img-wrap { position: relative; margin-bottom: 10px; }
      .product-card .product-img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 8px;
      }
      .stock-overlay {
        position: absolute;
        top: 8px;
        left: 8px;
        background: rgba(231,76,60,0.85);
        color: #fff;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 4px;
      }

      /* Size badge */
      .product-card .size-badge {
        background: #dfe6e9;
        color: #2d3436;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 13px;
        margin-bottom: 8px;
        display: inline-block;
      }

      /* Price block */
      .price-block {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin: 6px 0;
        flex-wrap: wrap;
      }
      .price-block .price {
        color: #6c5ce7;
        font-weight: 700;
        font-size: 15px;
      }
      .price-block .regular-price {
        color: #b2bec3;
        text-decoration: line-through;
        font-size: 12px;
      }
      .price-block .discount-badge {
        background: #e74c3c;
        color: #fff;
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 4px;
        font-weight: 600;
      }

      /* Availability text (fallback when no image) */
      .availability {
        font-size: 12px;
        margin-top: 4px;
        font-weight: 500;
      }
      .availability.in-stock { color: #00b894; }
      .availability.no-stock { color: #e74c3c; }

      /* Size chips */
      .product-card .available-sizes {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 8px;
      }
      .size-chip {
        display: inline-block;
        padding: 2px 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 11px;
        color: #666;
      }
      .size-chip.active {
        background: #6c5ce7;
        color: #fff;
        border-color: #6c5ce7;
        font-weight: 600;
      }

      /* CTA button */
      .product-card .view-btn {
        display: inline-block;
        margin-top: 12px;
        padding: 8px 20px;
        background: #6c5ce7;
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        transition: background 0.2s;
      }
      .product-card:hover .view-btn { background: #5a4bd1; }
      /* Size info banner */
      .size-info {
        background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
        color: #fff;
        border-radius: 12px;
        padding: 20px 24px;
        margin-bottom: 20px;
        text-align: center;
      }
      .size-info .size-main {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .size-info .size-sub {
        font-size: 13px;
        opacity: 0.85;
      }
      .rec-error {
        text-align: center;
        color: #e74c3c;
        padding: 40px 20px;
      }
      .rec-error button {
        margin-top: 16px;
        padding: 8px 24px;
        border: none;
        border-radius: 8px;
        background: #6c5ce7;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- <img src="image/blob.svg" class="blob" alt="background" /> -->
      <!-- <div class="orbit"></div> -->

      <div class="rec-container">
        <h2 style="text-align:center;margin-bottom:24px;">پیشنهادات محصول</h2>

        <!-- Loading -->
        <div id="recLoading" class="rec-loading">
          <span class="loader"></span>
          <p>در حال دریافت پیشنهادات از هوش مصنوعی...</p>
          <p style="font-size:12px;color:#999;">این فرایند ممکن است تا ۳ دقیقه طول بکشد.</p>
        </div>

        <!-- Results (hidden initially) -->
        <div id="recResults" style="display:none;">
          <!-- Calculated size banner -->
          <div id="sizeInfo" class="size-info" style="display:none;">
            <div>سایز محاسبه‌شده شما</div>
            <div id="sizeLabel" class="size-main"></div>
            <div id="sizeDetails" class="size-sub"></div>
          </div>

          <div id="recText" class="rec-text"></div>
          <h3 style="margin-bottom:12px;">محصولات پیشنهادی برای سایز شما</h3>
          <div id="recProducts" class="rec-products"></div>
        </div>

        <!-- Error (hidden initially) -->
        <div id="recError" class="rec-error" style="display:none;">
          <p id="recErrorMsg">خطا در دریافت پیشنهادات</p>
          <button onclick="location.reload()">تلاش دوباره</button>
        </div>
      </div>
    </div>

    <script src="./js/jQuery.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="./js/recommendations.js"></script>
  </body>
</html>
