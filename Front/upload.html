<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>upload page</title>
    <link rel="stylesheet" href="/css/mainlog.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="/fonts/remixicon.css" />
  </head>
  <body>
    <div class="container">
      <img src="image/blob.svg" class="blob" />
      <div class="orbit"></div>

      <div class="upload-form">
        <div class="h-tag-top">
          <h2>صفحه اپلود</h2>
          <span id="upload-form-help" class="help-icon">
            <i class="ri-error-warning-line"></i>
          </span>
        </div>
        <!-- Restructured form with uploadArea divs -->
        <form method="post" enctype="multipart/form-data">
          <div class="form-data-upload">
            <div class="upload-grid">
              <!-- Upload Area 1 -->
              <div class="upload-area" id="uploadArea1" data-input="photo1">
                <div class="upload-content">
                  <i class="ri-image-add-line upload-icon"></i>
                  <p class="upload-text">عکس جلو</p>
                  <span class="upload-hint">کلیک کنید</span>
                </div>
                <div class="image-preview-area" id="previewArea1"></div>
              </div>

              <!-- Upload Area 2 -->
              <div class="upload-area" id="uploadArea2" data-input="photo2">
                <div class="upload-content">
                  <i class="ri-image-add-line upload-icon"></i>
                  <p class="upload-text">عکس پشت</p>
                  <span class="upload-hint">کلیک کنید</span>
                </div>
                <div class="image-preview-area" id="previewArea2"></div>
              </div>

              <!-- Upload Area 3 -->
              <div class="upload-area" id="uploadArea3" data-input="photo3">
                <div class="upload-content">
                  <i class="ri-image-add-line upload-icon"></i>
                  <p class="upload-text">عکس کناری</p>
                  <span class="upload-hint">کلیک کنید</span>
                </div>
                <div class="image-preview-area" id="previewArea3"></div>
              </div>
            </div>

            <!-- Hidden file inputs -->
            <input
              id="photo1"
              name="image1"
              type="file"
              accept="image/*"
              style="display: none"
            />
            <input
              id="photo2"
              name="image2"
              type="file"
              accept="image/*"
              style="display: none"
            />
            <input
              id="photo3"
              name="image3"
              type="file"
              accept="image/*"
              style="display: none"
            />
          </div>
          <div class="form-data-input">
            <div class="textbox">
              <input
                id="height_cm"
                name="height_cm"
                type="number"
                step="0.1"
                min="50"
                max="250"
                required
              />
              <label for="height_cm">قد (cm)</label>
            </div>
            <div class="textbox">
              <input
                id="weight_kg"
                name="weight_kg"
                type="number"
                step="0.1"
                min="20"
                max="250"
                required
              />
              <label for="weight_kg">وزن (kg)</label>
            </div>
            <div class="textbox">
              <select id="gender" name="gender" required>
                <option value="" disabled selected></option>
                <option value="male">مرد</option>
                <option value="female">زن</option>
              </select>
              <label for="gender">جنسیت</label>
            </div>
            <button type="submit" id="upload-form-btn">
              آپلود و اندازه‌گیری
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- modal for photo-taking tips -->
    <div class="guidance-modal" id="guidanceModal">
      <div class="guidance-modal-box">
        <div class="guidance-icon">
          <i class="ri-camera-line"></i>
        </div>
        <h3 class="guidance-title">راهنمای عکس‌برداری</h3>
        <div class="guidance-content">
          <ul class="guidance-list">
            <li>در محیطی با نور کافی عکس بگیرید</li>
            <li>لباس‌های چسبان به بدن بپوشید</li>
            <li>از فاصله مناسب (۲-۳ متری) عکس بگیرید</li>
            <li>تمام بدن در قاب عکس باشد</li>
            <li>در حالت ایستاده و صاف عکس بگیرید</li>
          </ul>
        </div>
        <button type="button" class="guidance-close-btn">بستن</button>
      </div>
    </div>

    <!-- viewing uploaded images -->
    <div class="image-viewer-modal" id="imageViewerModal">
      <div class="image-viewer-box">
        <button type="button" class="viewer-close-btn">
          <i class="ri-close-line"></i>
        </button>
        <img src="/placeholder.svg" alt="Preview" id="viewerImage" />
      </div>
    </div>

    <script src="js/jQuery.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="./js/nakh.js"></script>
  </body>
</html>
