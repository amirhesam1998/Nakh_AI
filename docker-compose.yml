version: '3.8'

services:
  # Redis for data storage and Celery
  redis:
    image: redis:7-alpine
    container_name: nakh-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel CMS (online shop). Build context lives in ./Nakh_CMS.
  # NOTE: the Dockerfile for the CMS is not committed in this repo; supply your
  # own (php-fpm + nginx, or a webdevops/php-nginx image) or point this service
  # at an externally hosted CMS by removing it and setting SHOP_API_URL/
  # ECOMMERCE_AUTH_URL accordingly.
  nakh-cms:
    image: ${NAKH_CMS_IMAGE:-webdevops/php-nginx:8.2}
    container_name: nakh-cms
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./Nakh_CMS:/app
    environment:
      - WEB_DOCUMENT_ROOT=/app/public
    ports:
      - "8000:80"

  # Meilisearch — attribute-based product search
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: nakh-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: '${MEILISEARCH_KEY:-change-me-in-production}'
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nakh-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Reach the CMS by docker service name, not 127.0.0.1.
      - SHOP_API_URL=http://nakh-cms
      - ECOMMERCE_AUTH_URL=http://nakh-cms/api/v1/user
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILISEARCH_KEY:-change-me-in-production}
      - INTERNAL_API_URL=http://nakh-cms
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - SERVER_PORT=8000
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    ports:
      - "8002:8000"
    depends_on:
      redis:
        condition: service_healthy
      nakh-cms:
        condition: service_started
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nakh-celery-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_ENABLED=True
      - SHOP_API_URL=http://nakh-cms
      - ECOMMERCE_AUTH_URL=http://nakh-cms/api/v1/user
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    depends_on:
      redis:
        condition: service_healthy

  # Celery Beat (scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nakh-celery-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_ENABLED=True
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  media_data:
  logs_data:
  meilisearch_data:
