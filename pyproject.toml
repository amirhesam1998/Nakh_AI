[project]
name = "nakh-ai"
version = "0.1.0"
description = "AI-powered tailoring platform for body measurement analysis"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=0.25.0",
    "aiofiles>=23.2.0",
    "celery>=5.3.0",
    "email-validator>=2.1.0",
    "fastapi>=0.109.0",
    "httpx>=0.26.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",
    "mediapipe>=0.10.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=10.0.0",
    "pillow-heif>=0.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "pytorch-lightning>=2.0.0",
    "redis>=5.0.0",
    "scipy>=1.11.0",
    "smplx>=0.1.28",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.36.0",
    "trimesh>=4.0.0",
    "uvicorn[standard]>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false
